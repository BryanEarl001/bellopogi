<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TamBayts | My Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell simple-page">
      <header class="hero compact-hero">
        <a class="brand" href="index.html">TamBayts</a>
      </header>

      <section class="page-content">
        <p class="eyebrow">Order history</p>
        <h1>My orders</h1>

        <div class="order-tabs" id="order-tabs">
          <button class="selected" data-tab="active">Active</button>
          <button data-tab="past">Past orders</button>
        </div>

        <div id="order-list"></div>
      </section>

      <nav class="bottom-nav" aria-label="Main navigation">
        <a class="nav-item" href="profile.html" aria-label="Profile"><span>◉</span></a>
        <a class="nav-item" href="profile.html#favorites" aria-label="Favorites"><span>★</span></a>
        <a class="nav-item" href="index.html" aria-label="Home"><span>⌂</span></a>
        <a class="nav-item active" href="orders.html" aria-label="Orders"><span>▤</span></a>
        <a class="nav-item cart-nav" href="cart.html" aria-label="Cart">
          <span>🛒</span>
          <b class="cart-badge">0</b>
        </a>
      </nav>
    </main>

    <script src="app-data.js"></script>
    <script src="pages.js"></script>
  </body>
</html>
